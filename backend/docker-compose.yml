services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hometwin
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hometwin?sslmode=disable
      JWT_SECRET: change-me-in-production
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      TRIPO_API_KEY: ${TRIPO_API_KEY:-}
    ports: ["8080:8080"]
    restart: on-failure
    depends_on: [db]
    volumes: [./uploads:/app/uploads]
volumes:
  pgdata: {}